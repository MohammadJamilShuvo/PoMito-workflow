[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pomito-workflow"
version = "0.2.0"
description = "Taxon-aware mitochondrial genome recovery and comparative mitogenomics workflow"
requires-python = ">=3.10"
dependencies = ["biopython>=1.81", "pandas>=2.0"]

[project.scripts]
pomito = "pomito.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
